[project]
name = "practica-mlops-main"
version = "0.1.1"
description = "Proyecto MLOps con FastAPI, scikit-learn y dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3.0",
    "scikit-learn==1.6.1",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "gradio>=5.0,<7.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "jupyter>=1.0,<2.0",
    "notebook>=7.0,<8.0",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "watchfiles>=0.21,<2.0",
]

[tool.uv]
package = false
